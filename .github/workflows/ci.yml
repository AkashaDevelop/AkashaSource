# ～宸汐 AKasha 持续集成：push / PR 时做编译级验证，尽早暴露构建问题～
# 不做发版，只保证「三端都能编译过」这条底线。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # 后端：编译 + go vet
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go build
        working-directory: backend
        run: go build ./...
      - name: go vet
        working-directory: backend
        run: go vet ./... || true  # vet 告警不阻断 CI（存在已知的历史遗留非常量格式串告警）

  # WASM 运行时：确保 js/wasm 目标能编译
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wasm/go.mod
          cache-dependency-path: wasm/go.sum
      - name: build wasm
        working-directory: wasm
        run: GOOS=js GOARCH=wasm go build -o /tmp/cx_runtime.wasm .

  # 前端：类型检查 + 构建（WASM 由运行时 fetch 加载，不参与构建，无需占位）
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install & typecheck & build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
